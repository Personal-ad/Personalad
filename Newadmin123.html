<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Sri Lanka Classifieds & Local Business Listings">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Sri Lanka Hela Ad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { margin-bottom: 20px; color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; }
        button { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; }
        .del-btn { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; }
        .del-btn:hover { background: #dc2626; }
        .edit-btn { background: #10b981; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; margin-right: 5px; }
        .edit-btn:hover { background: #059669; }
        #adminDashboard { display: none; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Admin Login Card -->
        <div class="card" id="adminLoginCard" style="max-width: 400px; margin: 50px auto;">
            <h2><i class="fa-solid fa-lock"></i> ඇඩ්මින් ලොගින් (Admin Login)</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="adminUser" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPass" required placeholder="1234">
                </div>
                <button type="submit" style="width: 100%;">LOGIN</button>
            </form>
        </div>

        <!-- Admin Dashboard Content -->
        <div id="adminDashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1><i class="fa-solid fa-gauge"></i> Admin Dashboard</h1>
                <button id="adminLogoutBtn" class="del-btn" style="padding: 10px 15px;">Logout</button>
            </div>

            <!-- Admin Post Ad Section -->
            <div class="card">
                <h2>නව දැන්වීමක් එක් කිරීම (Admin Post Ad with Photo)</h2>
                <form id="adminAdForm">
                    <div class="form-group"><label>ශීර්ෂය (Title)</label><input type="text" id="admTitle" required placeholder="Admin Ad Title"></div>
                    <div class="form-group"><label>විස්තරය (Description)</label><textarea id="admDesc" rows="3" required placeholder="Description..."></textarea></div>
                    <div class="form-group"><label>ප්‍රවර්ගය (Category)</label>
                        <select id="admCategory"><option value="Boys">Boys</option><option value="Girls">Girls</option><option value="Shemale">Shemale</option><option value="Personal">Personal</option></select>
                    </div>
                    <div class="form-group"><label>ස්ථානය (Location)</label><input type="text" id="admLocation" required placeholder="Colombo"></div>
                    <div class="form-group"><label>මිල (Rs)</label><input type="number" id="admPrice" required value="0"></div>
                    <div class="form-group"><label>ඡායාරූපය උඩුගත කරන්න</label><input type="file" id="admImageFile" accept="image/*" required></div>
                    <div class="form-group"><label>දුරකථන අංකය (ඉලක්කම් 10)</label><input type="text" id="admContact" required maxlength="10" placeholder="0712345678"></div>
                    <button type="submit">දැන්වීම ප්‍රකාශ කරන්න (Post)</button>
                </form>
            </div>

            <!-- Users Management Section -->
            <div class="card">
                <h2>ලියාපදිංචි පරිශීලකයින් (Registered Users)</h2>
                <table>
                    <thead><tr><th>පරිශීලක නම (Username)</th><th>ක්‍රියාව (Action)</th></tr></thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

            <!-- All Ads Management -->
            <div class="card">
                <h2>සියලු දැන්වීම් කළමනාකරණය (All Ads)</h2>
                <table>
                    <thead><tr><th>ශීර්ෂය</th><th>පළ කළේ</th><th>මිල</th><th>Views</th><th>ක්‍රියාව</th></tr></thead>
                    <tbody id="adsTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Firebase Script for Admin -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD0C_usDNZkwuZ_6PBuCP424OMIl3Qf6eE",
          authDomain: "new-ad-9dc83.firebaseapp.com",
          projectId: "new-ad-9dc83",
          storageBucket: "new-ad-9dc83.firebasestorage.app",
          messagingSenderId: "822078837777",
          appId: "1:822078837777:web:a821551828a4f411330db0",
          measurementId: "G-LYR2S99GLW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let ads = [];
        let users = [];
        let isAdminLoggedIn = localStorage.getItem('admin_logged_in') === 'true';

        function checkAdminSession() {
            if (isAdminLoggedIn) {
                document.getElementById('adminLoginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminDataFromFirebase();
            } else {
                document.getElementById('adminLoginCard').style.display = 'block';
                document.getElementById('adminDashboard').style.display = 'none';
            }
        }

        document.getElementById('adminLoginForm').onsubmit = function(e) {
            e.preventDefault();
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === 'admin' && p === '1234') {
                isAdminLoggedIn = true;
                localStorage.setItem('admin_logged_in', 'true');
                checkAdminSession();
            } else {
                alert('වැරදි Username හෝ Password එකක්!');
            }
        };

        document.getElementById('adminLogoutBtn').onclick = function() {
            isAdminLoggedIn = false;
            localStorage.removeItem('admin_logged_in');
            checkAdminSession();
        };

        async function loadAdminDataFromFirebase() {
            try {
                const adsSnap = await getDocs(collection(db, "ads"));
                ads = [];
                adsSnap.forEach(docSnap => {
                    ads.push({ firebaseId: docSnap.id, ...docSnap.data() });
                });

                const usersSnap = await getDocs(collection(db, "users"));
                users = [];
                usersSnap.forEach(docSnap => {
                    users.push({ firebaseId: docSnap.id, ...docSnap.data() });
                });

                renderAdminTables();
            } catch (e) { console.error(e); }
        }

        function renderAdminTables() {
            const userBody = document.getElementById('usersTableBody');
            userBody.innerHTML = '';
            if (users.length === 0) {
                userBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#94a3b8;">පරිශීලකයින් නොමැත</td></tr>`;
            } else {
                users.forEach(userObj => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${userObj.username}</td><td></td>`;
                    const btn = document.createElement('button');
                    btn.className = 'del-btn';
                    btn.innerText = 'User මකන්න';
                    btn.onclick = () => deleteUser(userObj.firebaseId, userObj.username);
                    tr.cells[1].appendChild(btn);
                    userBody.appendChild(tr);
                });
            }

            const adsBody = document.getElementById('adsTableBody');
            adsBody.innerHTML = '';
            if (ads.length === 0) {
                adsBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">දැන්වීම් නොමැත</td></tr>`;
            } else {
                ads.forEach(ad => {
                    if(ad.views === undefined) ad.views = 0;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${ad.title}</td><td>${ad.poster}</td><td>Rs ${ad.price}</td><td>${ad.views}</td><td></td>`;
                    
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn';
                    editBtn.innerText = 'Views වෙනස් කරන්න';
                    editBtn.onclick = () => editViews(ad.firebaseId, ad.views);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'del-btn';
                    delBtn.innerText = 'මකන්න';
                    delBtn.onclick = () => deleteAd(ad.firebaseId);

                    tr.cells[4].appendChild(editBtn);
                    tr.cells[4].appendChild(delBtn);
                    adsBody.appendChild(tr);
                });
            }
        }

        document.getElementById('adminAdForm').onsubmit = function(e) {
            e.preventDefault();
            const contact = document.getElementById('admContact').value.trim();
            if(contact.length !== 10) { alert('ඉලක්කම් 10ක නිවැරදි අංකයක් දෙන්න!'); return; }

            const imageInput = document.getElementById('admImageFile');
            if (!imageInput.files || !imageInput.files[0]) { alert('කරුණාකර ඡායාරූපයක් තෝරන්න!'); return; }

            const reader = new FileReader();
            reader.onload = async function(event) {
                const newAd = {
                    title: document.getElementById('admTitle').value,
                    description: document.getElementById('admDesc').value,
                    category: document.getElementById('admCategory').value,
                    sub: `${document.getElementById('admLocation').value}, ${document.getElementById('admCategory').value}`,
                    price: Number(document.getElementById('admPrice').value).toLocaleString(),
                    imageUrl: event.target.result,
                    contact: contact,
                    poster: "Admin",
                    views: 0
                };

                try {
                    await addDoc(collection(db, "ads"), newAd);
                    document.getElementById('adminAdForm').reset();
                    loadAdminDataFromFirebase();
                    alert('ඇඩ්මින් දැන්වීම සාර්ථකව එකතු කරන ලදී!');
                } catch(err) { console.error(err); }
            };
            reader.readAsDataURL(imageInput.files[0]);
        };

        window.editViews = async function(firebaseId, currentViews) {
            const newViews = prompt(`නව Views ගණන ඇතුළත් කරන්න:`, currentViews || 0);
            if (newViews !== null) {
                const parsedViews = parseInt(newViews);
                if (!isNaN(parsedViews) && parsedViews >= 0) {
                    try {
                        await updateDoc(doc(db, "ads", firebaseId), { views: parsedViews });
                        loadAdminDataFromFirebase();
                        alert('Views ගණන සාර්ථකව යාවත්කාලීන කරන ලදී!');
                    } catch(e) { console.error(e); }
                } else { alert('කරුණාකර වලංගු අංකයක් ඇතුළත් කරන්න!'); }
            }
        };

        window.deleteAd = async function(firebaseId) {
            if(confirm('මෙම දැන්වීම මකා දැමීමට අවශ්‍යද?')) {
                try {
                    await deleteDoc(doc(db, "ads", firebaseId));
                    loadAdminDataFromFirebase();
                } catch(e) { console.error(e); }
            }
        };

        window.deleteUser = async function(firebaseId, username) {
            if(confirm(`"${username}" පරිශීලකයා මකා දැමීමට අවශ්‍යද?`)) {
                try {
                    await deleteDoc(doc(db, "users", firebaseId));
                    loadAdminDataFromFirebase();
                    alert('පරිශීලකයා සාර්ථකව ඉවත් කරන ලදී!');
                } catch(e) { console.error(e); }
            }
        };

        checkAdminSession();
    </script>
</body>
</html>
