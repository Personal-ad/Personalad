<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | Personal Ad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 10px; display: flex; flex-direction: column; min-height: 100vh; -webkit-text-size-adjust: 100%; }
        .container { max-width: 1000px; margin: 0 auto; width: 100%; flex: 1; }
        h1, h2 { margin-bottom: 15px; color: #38bdf8; font-size: 18px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; overflow: hidden; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input, textarea, select { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; font-size: 13px; }
        button { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; min-width: 600px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #334155; font-size: 12px; vertical-align: middle; }
        th { background: #334155; }
        
        tr.vip-row { background-color: rgba(245, 158, 11, 0.15); border-left: 4px solid #f59e0b; }

        .del-btn { background: #ef4444; color: #fff; padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: none; }
        .edit-btn { background: #10b981; color: #fff; padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: none; margin-right: 3px; margin-bottom: 3px; display: inline-block; }
        .vip-toggle-btn { background: #f59e0b; color: #fff; padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; border: none; margin-right: 3px; margin-bottom: 3px; display: inline-block; font-weight: bold; }
        #adminDashboard { display: none; }
        
        .footer { background: #1e293b; color: #94a3b8; text-align: center; padding: 15px; font-size: 12px; margin-top: auto; border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="adminLoginCard" style="max-width: 380px; margin: 30px auto;">
            <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group"><label>Username</label><input type="text" id="adminUser" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="adminPass" required></div>
                <button type="submit" style="width: 100%;">LOGIN</button>
            </form>
        </div>

        <div id="adminDashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h1><i class="fa-solid fa-gauge"></i> Admin Dashboard</h1>
                <button id="adminLogoutBtn" class="del-btn" style="padding: 6px 12px;">Logout</button>
            </div>

            <div class="card">
                <h2 id="admFormHeading">Admin Post Ad</h2>
                <form id="adminAdForm">
                    <input type="hidden" id="admEditId">
                    <div class="form-group"><label>Title</label><input type="text" id="admTitle" required></div>
                    <div class="form-group"><label>Description</label><textarea id="admDesc" rows="3" required></textarea></div>
                    <div class="form-group"><label>Category</label>
                        <select id="admCategory"><option value="Boys">Boys</option><option value="Girls">Girls</option><option value="Shemale">Shemale</option><option value="Personal">Personal</option></select>
                    </div>
                    <div class="form-group"><label>Location</label><input type="text" id="admLocation" required></div>
                    <div class="form-group"><label>Price (Rs)</label><input type="text" id="admPrice" required value="0"></div>
                    <div class="form-group"><label>Photo</label><input type="file" id="admImageFile" accept="image/*"></div>
                    <div class="form-group"><label>Contact (10 digits)</label><input type="text" id="admContact" required maxlength="10"></div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button type="submit" id="admSubmitBtn">Post Ad</button>
                        <button type="button" id="admCancelBtn" style="background:#64748b; color:#fff; display:none;" onclick="resetAdminForm(true)">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                    <h2>Registered Users</h2>
                    <input type="text" id="searchUserInp" placeholder="Search user..." style="max-width: 200px; padding: 6px 10px;">
                </div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Username</th><th>Action</th></tr></thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                    <h2>Manage All Ads</h2>
                    <input type="text" id="searchAdInp" placeholder="Search ads..." style="max-width: 200px; padding: 6px 10px;">
                </div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Title & Photo</th><th>Stats</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="adsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Personal Ad. Admin Panel.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const db = window.supabase.createClient('https://yeikgoqgiltcepcruqro.supabase.co', 'sb_publishable_d6lTY6i01EMhWm5fOKwZtQ_2HU_sorL');

        let ads = [], users = [];
        let isAdminLoggedIn = localStorage.getItem('is_admin_logged') === 'true'; 

        function timeAgo(dateString) {
            if (!dateString) return 'recently';
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return "just now";
        }

        function checkAdminSession() {
            if (!isAdminLoggedIn) {
                document.getElementById('adminLoginCard').style.display = 'block';
                document.getElementById('adminDashboard').style.display = 'none';
            } else {
                document.getElementById('adminLoginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminData();
            }
        }

        document.getElementById('adminLoginForm').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === 'admin' && p === '1234') {
                isAdminLoggedIn = true;
                localStorage.setItem('is_admin_logged', 'true');
                checkAdminSession();
            } else { 
                alert('පරිශීලක නාමය හෝ මුරපදය වැරදියි!'); 
            }
        };

        document.getElementById('adminLogoutBtn').onclick = () => {
            isAdminLoggedIn = false;
            localStorage.removeItem('is_admin_logged');
            checkAdminSession();
        };

        async function loadAdminData() {
            try {
                const { data: adsData } = await db.from('ads').select('*').order('created_at', { ascending: false, nullsFirst: false });
                ads = (adsData || []).map(item => ({ 
                    firebaseId: item.id, 
                    imageUrl: item.imageurl || item.imageUrl || '', 
                    likes: item.likes || 0, 
                    views: item.views || 0,
                    is_vip: item.is_vip || false,
                    created_at: item.created_at || item.inserted_at || new Date().toISOString(),
                    ...item 
                }));

                const { data: usersData } = await db.from('users').select('*');
                users = (usersData || []).map(item => ({ firebaseId: item.id, ...item }));

                renderTables();
            } catch (e) { console.error(e); }
        }

        function renderTables() {
            const userQuery = document.getElementById('searchUserInp').value.toLowerCase();
            const filteredUsers = users.filter(u => u.username.toLowerCase().includes(userQuery));

            const userBody = document.getElementById('usersTableBody');
            userBody.innerHTML = filteredUsers.length === 0 ? `<tr><td colspan="2">No users found</td></tr>` : filteredUsers.map(u => `<tr><td>${u.username}</td><td><button class="del-btn" onclick="deleteUser('${u.firebaseId}')">Delete</button></td></tr>`).join('');

            const adQuery = document.getElementById('searchAdInp').value.toLowerCase();
            const filteredAds = ads.filter(a => a.title.toLowerCase().includes(adQuery) || a.sub.toLowerCase().includes(adQuery));

            const adsBody = document.getElementById('adsTableBody');
            adsBody.innerHTML = filteredAds.length === 0 ? `<tr><td colspan="4">No ads found</td></tr>` : filteredAds.map(a => {
                const timeStr = timeAgo(a.created_at);
                return `<tr class="${a.is_vip ? 'vip-row' : ''}">
                    <td>
                        <div style="display:flex; gap:10px; align-items:center;">
                            ${a.imageUrl ? `<img src="${a.imageUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:4px; flex-shrink:0;">` : `<div style="width:40px; height:40px; background:#334155; display:flex; align-items:center; justify-content:center; font-size:8px; border-radius:4px; flex-shrink:0;">No Pic</div>`}
                            <div style="min-width:0; flex:1;">
                                <strong style="display:block; word-break:break-word; line-height:1.3;" title="${a.title}">${a.title}</strong>
                                <span style="font-size:10px; color:#94a3b8;">${timeStr}</span>
                            </div>
                        </div>
                    </td>
                    <td><i class="fa-solid fa-heart" style="color:#ef4444;"></i> ${a.likes} | <i class="fa-solid fa-eye" style="color:#38bdf8;"></i> ${a.views || 0}</td>
                    <td>${a.is_vip ? '<span style="color:#f59e0b; font-weight:bold;"><i class="fa-solid fa-crown"></i> VIP</span>' : 'Normal'}</td>
                    <td>
                        <button class="edit-btn" onclick="prepareEditAd('${a.firebaseId}')">Edit</button>
                        <button class="vip-toggle-btn" onclick="toggleVip('${a.firebaseId}', ${!!a.is_vip})">${a.is_vip ? 'Un-VIP' : 'VIP'}</button>
                        <button class="edit-btn" style="background:#f43f5e;" onclick="editLikes('${a.firebaseId}', ${a.likes})">Likes</button>
                        <button class="edit-btn" style="background:#0284c7;" onclick="editViews('${a.firebaseId}', ${a.views || 0})">Views</button>
                        <button class="del-btn" onclick="deleteAd('${a.firebaseId}')">Del</button>
                    </td>
                </tr>`;
            }).join('');
        }

        document.getElementById('searchUserInp').onkeyup = renderTables;
        document.getElementById('searchAdInp').onkeyup = renderTables;

        async function uploadImageToStorage(file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `adm_${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const { error } = await db.storage.from('ads-images').upload(fileName, file);
            if (error) throw new Error('පින්තූරය අප්‌ಲೋඩ් කිරීම අසාර්ථක විය: ' + error.message);
            const { data: publicUrlData } = db.storage.from('ads-images').getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        document.getElementById('adminAdForm').onsubmit = async (e) => {
            e.preventDefault();
            const contact = document.getElementById('admContact').value.trim();
            if (contact.length !== 10) { alert('දුරකථන අංකය වැරදියි!'); return; }
            
            const editId = document.getElementById('admEditId').value;
            const file = document.getElementById('admImageFile').files[0];

            try {
                let imageUrl = null;
                if (file) imageUrl = await uploadImageToStorage(file);

                const adData = {
                    title: document.getElementById('admTitle').value.trim(),
                    description: document.getElementById('admDesc').value.trim(),
                    category: document.getElementById('admCategory').value,
                    sub: `${document.getElementById('admLocation').value.trim()}, ${document.getElementById('admCategory').value}`,
                    price: document.getElementById('admPrice').value.trim(),
                    contact: contact
                };
                if (imageUrl) adData.imageurl = imageUrl;

                if (editId) {
                    await db.from('ads').update(adData).eq('id', editId);
                    alert('සාර්ථකව යාවත්කාලීන විය!');
                } else {
                    adData.poster = 'Admin';
                    adData.views = 0;
                    adData.likes = 0;
                    adData.is_vip = true;
                    if (!imageUrl) { alert('කරුණාකර ඡායාරූපයක් තෝරන්න'); return; }
                    await db.from('ads').insert([adData]);
                    alert('සාර්ථකව එකතු විය!');
                }
                
                resetAdminForm(true);
                await loadAdminData();
            } catch (err) { alert(err.message); }
        };

        window.prepareEditAd = (id) => {
            const ad = ads.find(a => a.firebaseId == id);
            if (!ad) return;
            
            window.history.pushState({ editing: true }, '', window.location.pathname);

            document.getElementById('admEditId').value = ad.firebaseId;
            document.getElementById('admTitle').value = ad.title;
            document.getElementById('admDesc').value = ad.description;
            document.getElementById('admCategory').value = ad.category;
            const parts = ad.sub.split(',');
            document.getElementById('admLocation').value = parts[0] ? parts[0].trim() : '';
            document.getElementById('admPrice').value = ad.price;
            document.getElementById('admContact').value = ad.contact;
            document.getElementById('admImageFile').value = '';
            document.getElementById('admFormHeading').innerText = 'Admin Edit Ad එක සංස්කරණය';
            document.getElementById('admSubmitBtn').innerText = 'Update Ad';
            document.getElementById('admCancelBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetAdminForm = (goBack = false) => {
            document.getElementById('adminAdForm').reset();
            document.getElementById('admEditId').value = '';
            document.getElementById('admFormHeading').innerText = 'Admin Post Ad';
            document.getElementById('admSubmitBtn').innerText = 'Post Ad';
            document.getElementById('admCancelBtn').style.display = 'none';
            if (goBack && window.history.state && window.history.state.editing) {
                window.history.back();
            }
        };

        window.toggleVip = async (id, currentStatus) => {
            await db.from('ads').update({ is_vip: !currentStatus }).eq('id', id);
            loadAdminData();
        };

        window.editLikes = async (id, currentLikes) => {
            const l = prompt('නව Likes ගණන ඇතුළත් කරන්න:', currentLikes);
            if (l !== null && !isNaN(l)) {
                await db.from('ads').update({ likes: parseInt(l) }).eq('id', id);
                loadAdminData();
            }
        };

        window.editViews = async (id, currentViews) => {
            const v = prompt('නව Views ගණන ඇතුළත් කරන්න:', currentViews);
            if (v !== null && !isNaN(v)) {
                await db.from('ads').update({ views: parseInt(v) }).eq('id', id);
                loadAdminData();
            }
        };

        window.deleteAd = async (id) => {
            if (confirm('මෙම දැන්වීම මකා දමන්නද?')) {
                await db.from('ads').delete().eq('id', id);
                loadAdminData();
            }
        };

        window.deleteUser = async (id) => {
            if (confirm('මෙම පරිශීලකයා මකා දමන්නද?')) {
                await db.from('users').delete().eq('id', id);
                loadAdminData();
            }
        };

        window.onpopstate = () => {
            resetAdminForm(false);
        };

        checkAdminSession();
    </script>
</body>
</html>
