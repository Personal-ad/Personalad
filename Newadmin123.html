<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Sri Lanka Hela Ad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { margin-bottom: 20px; color: #38bdf8; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; }
        button { background: #38bdf8; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; }
        .del-btn { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; }
        .edit-btn { background: #10b981; color: #fff; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; border: none; margin-right: 5px; }
        #adminDashboard { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="adminLoginCard" style="max-width: 400px; margin: 50px auto;">
            <h2><i class="fa-solid fa-lock"></i> Admin Login</h2>
            <form id="adminLoginForm">
                <div class="form-group"><label>Username</label><input type="text" id="adminUser" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="adminPass" required></div>
                <button type="submit" style="width: 100%;">LOGIN</button>
            </form>
        </div>

        <div id="adminDashboard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1><i class="fa-solid fa-gauge"></i> Admin Dashboard</h1>
                <button id="adminLogoutBtn" class="del-btn">Logout</button>
            </div>

            <div class="card">
                <h2 id="admFormHeading">Admin Post Ad</h2>
                <form id="adminAdForm">
                    <input type="hidden" id="admEditId">
                    <div class="form-group"><label>Title</label><input type="text" id="admTitle" required></div>
                    <div class="form-group"><label>Description</label><textarea id="admDesc" rows="3" required></textarea></div>
                    <div class="form-group"><label>Category</label>
                        <select id="admCategory"><option value="Boys">Boys</option><option value="Girls">Girls</option><option value="Shemale">Shemale</option><option value="Personal">Personal</option></select>
                    </div>
                    <div class="form-group"><label>Location</label><input type="text" id="admLocation" required></div>
                    <div class="form-group"><label>Price (Rs)</label><input type="text" id="admPrice" required value="0"></div>
                    <div class="form-group"><label>Photo (වෙනස් නොකරන්නේ නම් හිස්ව තබන්න)</label><input type="file" id="admImageFile" accept="image/*"></div>
                    <div class="form-group"><label>Contact (10 digits)</label><input type="text" id="admContact" required maxlength="10"></div>
                    <button type="submit" id="admSubmitBtn">Post Ad</button>
                    <button type="button" id="admCancelBtn" style="background:#64748b; color:#fff; display:none; margin-left:10px;" onclick="resetAdminForm()">Cancel</button>
                </form>
            </div>

            <div class="card">
                <h2>Registered Users</h2>
                <table>
                    <thead><tr><th>Username</th><th>Action</th></tr></thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>Manage All Ads</h2>
                <table>
                    <thead><tr><th>Title</th><th>Poster</th><th>Price</th><th>Views</th><th>Action</th></tr></thead>
                    <tbody id="adsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const db = window.supabase.createClient('https://yeikgoqgiltcepcruqro.supabase.co', 'sb_publishable_d6lTY6i01EMhWm5fOKwZtQ_2HU_sorL');

        let ads = [], users = [];
        let adminAuthToken = null; 

        async function checkAdminSession() {
            if (!adminAuthToken) {
                document.getElementById('adminLoginCard').style.display = 'block';
                document.getElementById('adminDashboard').style.display = 'none';
                return;
            }

            const { data, error } = await db.from('user_sessions')
                .select('expires_at, users(username)')
                .eq('auth_token', adminAuthToken)
                .single();

            if (error || !data || data.users.username !== 'admin' || new Date(data.expires_at) < new Date()) {
                adminAuthToken = null;
                document.getElementById('adminLoginCard').style.display = 'block';
                document.getElementById('adminDashboard').style.display = 'none';
            } else {
                document.getElementById('adminLoginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminData();
            }
        }

        document.getElementById('adminLoginForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value.trim();
            const p = document.getElementById('adminPass').value.trim();

            if (u === 'admin' && p === '1234') {
                try {
                    let { data: adminUserRecord } = await db.from('users').select('*').eq('username', 'admin');
                    let adminId;
                    if (!adminUserRecord || adminUserRecord.length === 0) {
                        const { data: newAdmin } = await db.from('users').insert([{ username: 'admin' }]).select();
                        adminId = newAdmin[0].id;
                    } else {
                        adminId = adminUserRecord[0].id;
                    }

                    const token = 'adm_tok_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                    // Permanent login for admin as well (100 years expiration)
                    const expiresAt = new Date(Date.now() + 100 * 365 * 24 * 60 * 60 * 1000).toISOString();

                    await db.from('user_sessions').insert([{ user_id: adminId, auth_token: token, expires_at: expiresAt }]);
                    
                    adminAuthToken = token;
                    checkAdminSession();
                } catch(err) {
                    alert('Login Error');
                }
            } else { 
                alert('වැරදියි!'); 
            }
        };

        document.getElementById('adminLogoutBtn').onclick = async () => {
            if (adminAuthToken) {
                await db.from('user_sessions').delete().eq('auth_token', adminAuthToken);
            }
            adminAuthToken = null;
            checkAdminSession();
        };

        async function loadAdminData() {
            try {
                const { data: adsData, error: adsErr } = await db.from('ads').select('*');
                if (adsErr) { console.error("Load Ads Error:", adsErr); }
                else { ads = (adsData || []).map(item => ({ firebaseId: item.id, imageUrl: item.imageurl, ...item })); }

                const { data: usersData, error: usersErr } = await db.from('users').select('*');
                if (usersErr) { console.error("Load Users Error:", usersErr); }
                else { users = (usersData || []).map(item => ({ firebaseId: item.id, ...item })); }

                renderTables();
            } catch (e) { console.error(e); }
        }

        function renderTables() {
            const userBody = document.getElementById('usersTableBody');
            userBody.innerHTML = users.length === 0 ? `<tr><td colspan="2">Empty</td></tr>` : users.map(u => `<tr><td>${u.username}</td><td><button class="del-btn" onclick="deleteUser('${u.firebaseId}')">Delete</button></td></tr>`).join('');

            const adsBody = document.getElementById('adsTableBody');
            adsBody.innerHTML = ads.length === 0 ? `<tr><td colspan="5">Empty</td></tr>` : ads.map(a => `<tr><td>${a.title}</td><td>${a.poster || 'Admin'}</td><td>Rs ${a.price}</td><td>${a.views || 0}</td><td><button class="edit-btn" onclick="prepareEditAd('${a.firebaseId}')">Edit</button><button class="edit-btn" style="background:#0284c7;" onclick="editViews('${a.firebaseId}', ${a.views || 0})">Views</button><button class="del-btn" onclick="deleteAd('${a.firebaseId}')">Delete</button></td></tr>`).join('');
        }

        function getOriginalImage(file, cb) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                cb(e.target.result);
            };
        }

        document.getElementById('adminAdForm').onsubmit = (e) => {
            e.preventDefault();
            const contact = document.getElementById('admContact').value.trim();
            if (contact.length !== 10) { alert('දුරකථන අංකය වැරදියි!'); return; }
            
            const editId = document.getElementById('admEditId').value;
            const file = document.getElementById('admImageFile').files[0];

            const processAdminSave = async (imageurl) => {
                const adData = {
                    title: document.getElementById('admTitle').value.trim(),
                    description: document.getElementById('admDesc').value.trim(),
                    category: document.getElementById('admCategory').value,
                    sub: `${document.getElementById('admLocation').value.trim()}, ${document.getElementById('admCategory').value}`,
                    price: document.getElementById('admPrice').value.trim(),
                    contact: contact
                };
                if (imageurl) adData.imageurl = imageurl;

                if (editId) {
                    const { error } = await db.from('ads').update(adData).eq('id', editId);
                    if (error) { alert('දෝෂයක් සිදු විය'); return; }
                    alert('දැන්වීම සාර්ථකව යාවත්කාලීන විය!');
                } else {
                    adData.poster = 'Admin';
                    adData.views = 0;
                    if (!imageurl) { alert('ඡායාරූපයක් තෝරන්න'); return; }
                    const { error } = await db.from('ads').insert([adData]);
                    if (error) { alert('දෝෂයක් සිදු විය'); return; }
                    alert('දැන්වීම සාර්ථකව එකතු විය!');
                }
                
                resetAdminForm();
                await loadAdminData();
            };

            if (file) {
                getOriginalImage(file, processAdminSave);
            } else {
                if (!editId) { alert('ඡායාරූපයක් තෝරන්න'); return; }
                processAdminSave(null);
            }
        };

        window.prepareEditAd = (id) => {
            const ad = ads.find(a => a.firebaseId === id);
            if (!ad) return;
            document.getElementById('admEditId').value = ad.firebaseId;
            document.getElementById('admTitle').value = ad.title;
            document.getElementById('admDesc').value = ad.description;
            document.getElementById('admCategory').value = ad.category;
            const parts = ad.sub.split(',');
            document.getElementById('admLocation').value = parts[0] ? parts[0].trim() : '';
            document.getElementById('admPrice').value = ad.price;
            document.getElementById('admContact').value = ad.contact;
            document.getElementById('admImageFile').value = '';
            document.getElementById('admFormHeading').innerText = 'Admin Edit Ad';
            document.getElementById('admSubmitBtn').innerText = 'Update Ad';
            document.getElementById('admCancelBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetAdminForm = () => {
            document.getElementById('adminAdForm').reset();
            document.getElementById('admEditId').value = '';
            document.getElementById('admFormHeading').innerText = 'Admin Post Ad';
            document.getElementById('admSubmitBtn').innerText = 'Post Ad';
            document.getElementById('admCancelBtn').style.display = 'none';
        };

        window.editViews = async (id, currentViews) => {
            const v = prompt('නව Views ගණන:', currentViews);
            if (v !== null && !isNaN(v)) {
                await db.from('ads').update({ views: parseInt(v) }).eq('id', id);
                loadAdminData();
            }
        };

        window.deleteAd = async (id) => {
            if (confirm('මෙම දැන්වීම මකා දමන්නද?')) {
                await db.from('ads').delete().eq('id', id);
                loadAdminData();
            }
        };

        window.deleteUser = async (id) => {
            if (confirm('මෙම පරිශීලකයා මකා දමන්නද?')) {
                await db.from('users').delete().eq('id', id);
                loadAdminData();
            }
        };

        checkAdminSession();
    </script>
</body>
</html>
